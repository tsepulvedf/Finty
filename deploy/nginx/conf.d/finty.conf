# Finty — API Gateway (ADR-06, ADR-08, ADR-09; ARCHITECTURE.md §10.3).
#
# Punto de entrada unico: es el unico contenedor que publica un puerto en el
# host. Todo lo demas solo es alcanzable desde la red interna de Compose.

# DNS interno de Docker. Con `resolve` en los upstreams, Nginx vuelve a resolver
# el nombre del contenedor cuando este se recrea y cambia de IP, en lugar de
# quedarse con la IP del arranque y responder 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Rate limiting (D-17) ----------------------------------------------------
#
# Dos zonas por IP. Nginx corta rafagas antes de que lleguen a Django o a Flask;
# las cuotas por hora siguen siendo de DRF en las rutas que sirve Django
# (anon 60/h, user 1000/h). Valores justificados en ARCHITECTURE.md §13, D-17.
#
# - finty_auth: login y registro. 6 por minuto sostenido, rafaga de 10.
# - finty_api:  todo /api/v1/. 20 por segundo sostenido, rafaga de 50.
limit_req_zone $binary_remote_addr zone=finty_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=finty_api:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# --- Respuestas del Gateway con la forma del contrato -------------------------
#
# Cuando la verificacion del token falla, Django dice por que en `X-Auth-Error`
# y aqui se traduce al mismo `{"detail": ...}` que respondia DRF, con el mismo
# texto de `TokenAuthentication` en es-co (ADR-09).
map $finty_auth_error $finty_auth_detail {
    default                          "Las credenciales de autenticación no se proveyeron.";
    token_header_without_credentials "Cabecera token inválida. Las credenciales no fueron suministradas.";
    token_header_with_spaces         "Cabecera token inválida. La cadena token no debe contener espacios.";
    token_header_invalid_characters  "Cabecera token inválida. La cadena token no debe contener caracteres inválidos.";
    invalid_token                    "Token inválido.";
    inactive_user                    "Usuario inactivo o borrado.";
}

# --- Upstreams ---------------------------------------------------------------

upstream monolith {
    zone monolith 64k;
    server django:8000 resolve;
    keepalive 16;
}

# CONMUTADOR STRANGLER del bloque `finance` (ADR-08). Las tres rutas del
# agregado se conmutan juntas: esta linea `server` y el `include` de
# `gateway-auth.conf` en el bloque de finance, mas abajo.
# Conmutado a finance-service el 2026-10-20 (E2-M2b). Para volver al monolito:
# `server django:8000 resolve;` y quitar el `include` de gateway-auth.conf.
upstream finance_backend {
    zone finance_backend 64k;
    server finance-service:8000 resolve;
    keepalive 16;
}

# --- Servidor ----------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # Identidad que se reenvia a los backends en `X-User-Id`. Vacia por defecto,
    # asi que la del cliente nunca pasa; solo `auth_request_set` la llena.
    set $finty_user_id "";
    set $finty_auth_error "";

    error_page 429 = @gateway_throttled;

    # /internal/ es solo para subpeticiones del Gateway (ADR-09). `^~` le da
    # prioridad sobre los bloques regex, asi que nada lo alcanza desde fuera.
    location ^~ /internal/ {
        return 404;
    }

    # Subpeticion de `auth_request`: solo `Authorization`, sin cuerpo y siempre
    # con GET, hacia el endpoint interno de Django.
    location = /_gateway/auth/verify {
        internal;
        proxy_pass http://monolith/internal/auth/verify/;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Length "";
    }

    # Estaticos servidos por Nginx sin pasar por Django. Los copia la etapa
    # `gateway` del Dockerfile desde el `collectstatic` de la imagen de Django.
    location /static/ {
        alias /usr/share/nginx/finty-static/;
        expires 7d;
        access_log off;
    }

    # Login y registro: zona estricta, ademas de la general.
    location ~ ^/api/v1/auth/(login|register)(/|\.|$) {
        limit_req zone=finty_auth burst=10 nodelay;
        limit_req zone=finty_api burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    # Bloque de finance: el que conmuta el Strangler. La regex captura tambien
    # las variantes con sufijo (`/accounts.json`) y sin barra final, para que
    # ninguna ruta del agregado llegue al backend equivocado.
    location ~ ^/api/v1/(accounts|transactions|categories)(/|\.|$) {
        limit_req zone=finty_api burst=50 nodelay;
        # Marca de ruta: la suite de contrato verifica con ella que cada variante
        # cae en este bloque.
        add_header X-Finty-Route finance always;
        # finance-service no valida tokens: confia en X-User-Id (ADR-09).
        include /etc/nginx/snippets/gateway-auth.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://finance_backend;
    }

    # Resto del contrato /api/v1/: health, profile y la raiz del router.
    location /api/v1/ {
        limit_req zone=finty_api burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    location /admin/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    # Frontend (plantillas de Django).
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    # 401 del Gateway, con la forma y el texto que respondia DRF.
    location @gateway_unauthorized {
        default_type application/json;
        add_header WWW-Authenticate "Token" always;
        add_header X-Finty-Route finance always;
        return 401 '{"detail":"$finty_auth_detail"}';
    }

    # 429 de `limit_req`, con la forma del contrato y el texto de DRF.
    location @gateway_throttled {
        default_type application/json;
        return 429 '{"detail":"Solicitud fue regulada (throttled)."}';
    }
}
