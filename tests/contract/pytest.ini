[pytest]
# Suite de contrato de caja negra (A-20). Solo HTTP contra CONTRACT_BASE_URL:
# no importa codigo de Finty ni configura Django, asi que se desactiva el plugin
# de pytest-django que esta instalado en el entorno del monolito.
addopts = -p no:django -p no:cacheprovider
python_files = test_*.py
markers =
    throttle: agota las cuotas de limit_req; solo corre con CONTRACT_THROTTLE=1
