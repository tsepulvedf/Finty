# Plantilla de contexto http: la imagen oficial sustituye solo la clave interna.
upstream django_backend { server django_web:8000; }
upstream flask_backend { server flask_categorization:5000; }
limit_req_zone $binary_remote_addr zone=categorization:10m rate=10r/s;

server {
    listen 80;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    location = /_auth_verify {
        internal;
        proxy_pass http://django_backend/api/v1/auth/verify/;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/v2/categorization { return 308 /api/v2/categorization/; }
    location ^~ /api/v2/categorization/ {
        auth_request /_auth_verify;
        limit_req zone=categorization burst=20 nodelay;
        limit_req_status 429;
        # Sobrescribe una posible clave enviada por un cliente externo.
        proxy_set_header X-Service-Token "${CATEGORIZATION_SERVICE_TOKEN}";
        proxy_set_header Authorization "";
        # Sin URI final: Flask recibe intacto /api/v2/categorization/.
        proxy_pass http://flask_backend;
        proxy_intercept_errors on;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 502 503 504 = @unavailable;
    }
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":{"code":"UNAUTHORIZED","message":"Token de usuario requerido o invalido."}}';
    }
    location @forbidden {
        default_type application/json;
        return 403 '{"error":{"code":"FORBIDDEN","message":"Acceso rechazado."}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Clasificacion temporalmente no disponible."}}';
    }
    location /api/v1/ { proxy_pass http://django_backend; }
    location /static/ { alias /static/; }
    location / { proxy_pass http://django_backend; }
}
