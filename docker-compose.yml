# Finty — orquestacion local de la Entrega 2 (ADR-16).
#
# E2-M1a: monolito Django, PostgreSQL, Redis y el Gateway Nginx.
# E2-M2: finance-service (Flask) y su paso de migraciones; desde E2-M2b recibe
# el bloque finance del Gateway.
# E2-M3b: categorization-service (Flask, sin base), que finance-service consume.
# Los demas servicios Flask y los workers de Celery se agregan en sus modulos.
#
#   cp .env.docker.example .env.docker                       # y completa los valores
#   cp services/finance-service/.env.docker.example services/finance-service/.env.docker
#   docker compose up -d --build
#
# Solo `nginx` publica un puerto en el host (A-17). El resto se comunica por la
# red interna de Compose.

name: finty

# Configuracion compartida por el servidor Django y el paso de migraciones:
# misma imagen, mismo entorno.
x-django: &django
  build:
    context: .
    target: django
  image: finty/django:local
  env_file: .env.docker

# Igual para finance-service: el proceso web y su paso de migraciones comparten
# imagen y entorno. El entorno es otro archivo: solo la URL de su base (A-21).
x-finance: &finance
  build:
    context: ./services/finance-service
  image: finty/finance-service:local
  env_file: services/finance-service/.env.docker
  environment:
    # Sin secretos: va aqui y no en el env_file, para que un `git pull` baste.
    CATEGORIZATION_URL: http://categorization-service:8000

services:
  db:
    image: postgres:18
    env_file: .env.docker
    volumes:
      # PostgreSQL 18 guarda los datos en un subdirectorio por version, asi que
      # el volumen se monta en /var/lib/postgresql y no en .../data.
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP a proposito: durante la inicializacion la imagen levanta un
      # servidor temporal que solo escucha en el socket local. Asi la base no
      # se reporta sana hasta que el script de bases haya terminado.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d finty_identity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Paso de un solo uso: crea las bases logicas que falten (ADR-04.1). El script
  # de initdb solo corre con el volumen vacio; este corre en cada `up`, asi que
  # una base nueva aparece tambien en un volumen existente, como el de la EC2.
  db-init:
    image: postgres:18
    env_file: .env.docker
    environment:
      PGHOST: db
    command: ["sh", "/finty-init/01-create-databases.sh"]
    volumes:
      - ./deploy/postgres/init:/finty-init:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Paso de un solo uso: aplica las migraciones pendientes y termina. Django no
  # arranca hasta que este paso termine con exito.
  migrate:
    <<: *django
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  django:
    <<: *django
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Paso de un solo uso: migraciones de finty_finance con Alembic, incluida la
  # siembra del catalogo de categorias (D-16).
  finance-migrate:
    <<: *finance
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Sin `ports`: solo alcanzable desde la red interna (A-17). Nginx todavia no
  # le envia trafico.
  # Sin base de datos y sin secretos: se configura con `environment:` y no con un
  # env_file. El proveedor se elige al levantarlo, sin editar archivos:
  #   CATEGORIZER_PROVIDER=MOCK docker compose up -d categorization-service
  # Sin `ports` (A-17) y sin bloque en Nginx: solo lo alcanza la red interna.
  categorization-service:
    build:
      context: ./services/categorization-service
    image: finty/categorization-service:local
    environment:
      CATEGORIZER_PROVIDER: ${CATEGORIZER_PROVIDER:-RULE}
      TIME_ZONE: America/Bogota
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  finance-service:
    <<: *finance
    depends_on:
      finance-migrate:
        condition: service_completed_successfully
      categorization-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: gateway
    image: finty/gateway:local
    ports:
      - "80:80"
    depends_on:
      - django
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
