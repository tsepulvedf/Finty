# Finty — API Gateway (ADR-06, ADR-08, ADR-09; ARCHITECTURE.md §10.3).
#
# Punto de entrada unico: es el unico contenedor que publica un puerto en el
# host. Todo lo demas solo es alcanzable desde la red interna de Compose.

# DNS interno de Docker. Con `resolve` en los upstreams, Nginx vuelve a resolver
# el nombre del contenedor cuando este se recrea y cambia de IP, en lugar de
# quedarse con la IP del arranque y responder 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Upstreams ---------------------------------------------------------------

upstream monolith {
    zone monolith 64k;
    server django:8000 resolve;
    keepalive 16;
}

# CONMUTADOR STRANGLER del bloque `finance` (ADR-08).
# Hoy apunta al monolito. En E2-M2, una vez que `finance-service` pase la suite
# de contrato (A-20), se cambia solo la linea `server` y se agrega
# `auth_request` en el bloque `location` de finance mas abajo. Ninguna otra
# parte de este archivo cambia.
upstream finance_backend {
    zone finance_backend 64k;
    server django:8000 resolve;
    keepalive 16;
}

# --- Servidor ----------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # /internal/ es solo para subpeticiones del Gateway (ADR-09). `^~` le da
    # prioridad sobre los bloques regex, asi que nada lo alcanza desde fuera.
    location ^~ /internal/ {
        return 404;
    }

    # Estaticos servidos por Nginx sin pasar por Django. Los copia la etapa
    # `gateway` del Dockerfile desde el `collectstatic` de la imagen de Django.
    location /static/ {
        alias /usr/share/nginx/finty-static/;
        expires 7d;
        access_log off;
    }

    # Bloque de rutas de finance: el que conmuta el Strangler.
    location ~ ^/api/v1/(accounts|transactions|categories)(/|$) {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://finance_backend;
    }

    # Resto del contrato /api/v1/: health, auth y profile (identity).
    location /api/v1/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    location /admin/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }

    # Frontend (plantillas de Django).
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://monolith;
    }
}
