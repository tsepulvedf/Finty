# Autenticacion centralizada en el Gateway (ADR-09).
#
# Se incluye en los bloques cuyo backend no valida tokens: finance, analytics,
# recommendation y subscription.
#
# 1. Antes de reenviar, Nginx consulta a Django con una subpeticion GET que solo
#    lleva `Authorization` (`/_gateway/auth/verify`).
# 2. Si Django responde 200, `X-User-Id` pasa a `$finty_user_id`, y
#    `proxy.conf` la reenvia al servicio.
# 3. Si responde 401, el motivo llega en `X-Auth-Error` y `@gateway_unauthorized`
#    responde al cliente con el mismo JSON que respondia DRF.
#
# El token no sigue hacia el servicio: no lo necesita y no debe verlo.

auth_request /_gateway/auth/verify;
auth_request_set $finty_user_id $upstream_http_x_user_id;
auth_request_set $finty_auth_error $upstream_http_x_auth_error;

# Un `error_page` en el bloque anula los heredados del servidor: el de 429 se
# repite aqui.
error_page 401 = @gateway_unauthorized;
error_page 429 = @gateway_throttled;

proxy_set_header Authorization "";
