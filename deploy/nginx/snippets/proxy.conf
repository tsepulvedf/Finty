# Cabeceras comunes a todo bloque que hace proxy hacia un backend.
#
# Se incluye dentro de cada `location` porque Nginx no hereda `proxy_set_header`
# del nivel `server` en cuanto un bloque declara uno propio.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se sobrescribe, no se encadena: un X-Forwarded-For enviado por el cliente
# falsearia la IP con la que DRF aplica el throttling anonimo.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# ADR-09: la identidad solo la puede poner el Gateway. Una cadena vacia hace que
# Nginx no reenvie la cabecera, asi que cualquier X-User-Id del cliente se
# descarta aqui. En E2-M2, los bloques autenticados lo reemplazan por el valor
# que devuelva `auth_request`.
proxy_set_header X-User-Id "";
