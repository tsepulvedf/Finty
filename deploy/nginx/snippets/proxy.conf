# Cabeceras comunes a todo bloque que hace proxy hacia un backend.
#
# Se incluye dentro de cada `location` porque Nginx no hereda `proxy_set_header`
# del nivel `server` en cuanto un bloque declara uno propio.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se sobrescribe, no se encadena: un X-Forwarded-For enviado por el cliente
# falsearia la IP con la que DRF aplica el throttling anonimo.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# ADR-09: la identidad solo la puede poner el Gateway. `$finty_user_id` es vacia
# salvo en los bloques que incluyen `gateway-auth.conf`, donde la llena
# `auth_request_set` con lo que verifico Django. Una cadena vacia hace que Nginx
# no reenvie la cabecera, asi que cualquier X-User-Id del cliente se descarta.
proxy_set_header X-User-Id $finty_user_id;

# INV-06: un servicio que llama a otro por la red interna se identifica con
# `X-Finty-Caller` (recommendation → analytics) y no pasa por el gating premium.
# Una cadena vacia hace que Nginx no la reenvie: desde fuera nunca llega.
proxy_set_header X-Finty-Caller "";
