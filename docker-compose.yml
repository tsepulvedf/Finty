services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-finty}
      POSTGRES_USER: ${DB_USER:-finty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  django_web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Completa SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,django_web
      DB_NAME: ${DB_NAME:-finty}
      DB_USER: ${DB_USER:-finty}
      DB_PASSWORD: ${DB_PASSWORD:?Completa DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      CATEGORIZER_PROVIDER: ${CATEGORIZER_PROVIDER:-REMOTE}
      CATEGORIZATION_SERVICE_URL: http://flask_categorization:5000/api/v2/categorization/
      CATEGORIZATION_SERVICE_TOKEN: ${CATEGORIZATION_SERVICE_TOKEN:?Completa CATEGORIZATION_SERVICE_TOKEN}
      CATEGORIZATION_TIMEOUT_SECONDS: ${CATEGORIZATION_TIMEOUT_SECONDS:-1.0}
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 30 config.wsgi:application']
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  flask_categorization:
    build:
      context: .
      dockerfile: services/categorization/Dockerfile
    environment:
      CATEGORIZATION_SERVICE_TOKEN: ${CATEGORIZATION_SERVICE_TOKEN:?Completa CATEGORIZATION_SERVICE_TOKEN}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8080}:80"
    environment:
      CATEGORIZATION_SERVICE_TOKEN: ${CATEGORIZATION_SERVICE_TOKEN:?Completa CATEGORIZATION_SERVICE_TOKEN}
      NGINX_ENVSUBST_FILTER: ^CATEGORIZATION_SERVICE_TOKEN$$
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static_data:/static:ro
    depends_on:
      django_web:
        condition: service_healthy
      flask_categorization:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
